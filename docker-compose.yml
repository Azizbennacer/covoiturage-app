services:
  backend:
    build: ./backend
    ports:
      - "8081:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:mysql://localhost:3306/covoiturage  
      
  frontend:
    build: ./Frontend
    ports:
      - "4200:80"   # Change 80 en 4200 (ou 3000, 8081, etc.)
    # Supprime depends_on: backend → Pas besoin, frontend est statique !

